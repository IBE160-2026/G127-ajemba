after = [
  { epic = 2, needs = "test lecture 1, the builder's own PowerPoint PDF" },
  { epic = 3, needs = "Summary generation and its validators to evaluate" },
  { epic = 4, needs = "Multiple Choice generation to evaluate" },
]
