# tickets.toml for initiative-recall: the epics in build order.
# `tier` is our own key (tickets.py ignores it): must-have or if-time.

[[epic]]
id = 1
slug = "epic-foundation-accounts"
title = "Foundation and accounts"
covers = ["FR-1", "FR-2", "SM-7"]
tier = "must-have"

[[epic]]
id = 2
slug = "epic-upload-pdf-checks"
title = "Upload and PDF checks"
covers = ["FR-3", "FR-4", "FR-6", "FR-7", "SM-8"]
after = [{ epic = 1, needs = "logged-in users, the base template, settings and the test setup" }]
tier = "must-have"

[[epic]]
id = 3
slug = "epic-summary"
title = "Summary with source references"
covers = ["FR-5", "FR-8", "FR-9", "FR-10", "FR-11", "FR-25", "FR-27", "SM-1", "SM-2"]
after = [
  { epic = 1, needs = "the project skeleton for ai_client and settings" },
  { epic = 2, needs = "a stored Lecture with per-page text after a valid upload" },
]
tier = "must-have"

[[epic]]
id = 4
slug = "epic-multiple-choice-results"
title = "Multiple choice, results and saved lectures"
covers = ["FR-12", "FR-13", "FR-18", "FR-19", "FR-20", "SM-3", "SM-6"]
after = [{ epic = 3, needs = "Summary Parts, the AI client, the job system and the validators" }]
