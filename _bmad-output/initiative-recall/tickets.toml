[[epic]]
id = 5
slug = "epic-demo-readme"
title = "Demo Mode and README"
covers = ["FR-23", "FR-24", "SM-9"]
after = [
  { epic = 1, needs = "the project skeleton and run.py to document" },
  { epic = 4, needs = "a complete flow (Summary, quiz, results) to demonstrate" },
]
tier = "must-have"

[[epic]]
id = 6
slug = "epic-evaluation"
