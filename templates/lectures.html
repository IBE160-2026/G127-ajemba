{% extends "base.html" %}
{% block title %}My lectures - Recall{% endblock %}
{% block content %}
  <h1>My lectures</h1>
  {% if lectures %}
    {% for lecture in lectures %}
      <div class="card">
        <a href="{% url 'lecture_detail' lecture.id %}">{{ lecture.title }}</a>
        {% include "lectures/_status_row.html" %}
      </div>
    {% endfor %}
  {% else %}
    <p>No lectures yet.</p>
  {% endif %}
{% endblock %}
